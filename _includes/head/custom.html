<!-- Enlarge the author profile portrait on desktop widths -->
<style>
  @media (min-width: 1024px) {
    .sidebar .author__avatar img { max-width: 180px; }
  }
  @media (min-width: 1280px) {
    .sidebar .author__avatar img { max-width: 240px; }
  }
</style>

<!-- Adapt the homepage greeting to the visitor's local time zone.
     The server renders a UTC+8 (Asia/Hong_Kong) greeting by default; this
     rewrites it based on the visitor's own clock when JavaScript is available. -->
<script>
  (function () {
    function timeGreeting(hour) {
      if (hour >= 5 && hour < 12) { return "Good morning!"; }
      if (hour >= 12 && hour < 18) { return "Good afternoon!"; }
      return "Good evening!";
    }
    function applyGreeting() {
      var el = document.getElementById("greeting");
      if (!el) { return; }
      el.textContent = timeGreeting(new Date().getHours());
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", applyGreeting);
    } else {
      applyGreeting();
    }
  })();
</script>

<!-- end custom head snippets -->
